apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:b3659db7a679c70b1363589e27cf327d432d5a20
        ports:
        - containerPort: 5000