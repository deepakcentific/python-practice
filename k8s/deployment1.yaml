apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: deepak.azurecr.io/app1/flask-api:c0e0a8a944a30d83b258ee55970d1565139327d5
        ports:
        - containerPort: 5000