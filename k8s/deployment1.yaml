apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:5453bed2f810c9d8d59e4947da4cf9f418894ae5
        ports:
        - containerPort: 5000