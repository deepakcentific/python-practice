apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:2f17ec13d5246bc57034584eb7b548f2e2c61838
        ports:
        - containerPort: 5000