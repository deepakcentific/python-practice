apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:52961aaca4b3bab68c196081a2021c20165dd5db
        ports:
        - containerPort: 5000