apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:606909c832e4968e3e7ea2da330ead16fafb0e82
        ports:
        - containerPort: 5000