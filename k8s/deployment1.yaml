apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:2257080f618448125486d0d0821f6408a8225dd1
        ports:
        - containerPort: 5000