apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:6475928b51cc1c63c6d5e48f57318896d716f3f5
        ports:
        - containerPort: 5000