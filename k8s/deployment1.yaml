apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: deepak.azurecr.io/app1/flask-api:8580754550db4b792537b0ff7aad5baa92bc4bf1
        ports:
        - containerPort: 5000