apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: deepak.azurecr.io/app1/flask-api:432ba0775fd1d9fe3c5db83103dc15f8011b8c5f
        ports:
        - containerPort: 5000