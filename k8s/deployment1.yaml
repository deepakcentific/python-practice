apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:145714414a30b2b06d32133a3a231da9950286af
        ports:
        - containerPort: 5000