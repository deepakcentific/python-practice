apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: deepak.azurecr.io/app1/flask-api:90039bf00a67b776ebc7cead00ad907f1972a679
        ports:
        - containerPort: 5000