apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
        template: flask-api
    spec:
      containers:
      - name: flask-api
        image: deepak.azurecr.io/app1/flask-api:72c5991775a2c49786dc7a05786774ba5d707dce
        ports:
        - containerPort: 5000