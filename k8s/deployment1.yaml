apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask-api
        image: dsahoo165/flask-api:950207dd603df96ddeeb6e91e82551a7809ccbae
        ports:
        - containerPort: 5000