apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api-2
  template:
    metadata:
      labels:
        app: flask-api-2
        template: flask-api-2
    spec:
      containers:
      - name: flask-api-2
        image: deepak.azurecr.io/app2/flask-api-2:e1a55205ae6aee9a0ffbcac8103a08ee32a90b7b
        ports:
        - containerPort: 5000