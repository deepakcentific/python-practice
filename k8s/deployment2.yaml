apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api-2
  template:
    metadata:
      labels:
        app: flask-api-2
        template: flask-api-2
    spec:
      containers:
      - name: flask-api-2
        image: deepak.azurecr.io/app2/flask-api-2:cdb5ff068d6aa6750e7e484fd4fb031d82b79a5f
        ports:
        - containerPort: 5000