name: Flask API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code_build:
    name: Build and Test Flask API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install Flask pytest

      - name: Run tests
        run: pytest


  docker_build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: code_build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          # Push both latest and commit SHA tagged images to Docker Hub.
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-api:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ github.sha }} .
          docker image ls
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ github.sha }}


