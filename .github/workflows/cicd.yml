name: Flask API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write # to allow pushing changes back to the repository

jobs:
  code_build:
    name: Build and Test Flask API
    # runs-on: ubuntu-latest
    # runs-on: [self-hosted, flask]
    runs-on: [self-hosted, azurevm]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install Flask pytest

      - name: Run tests
        run: pytest


  docker_build:
    name: Build and Push Docker Image
    # runs-on: ubuntu-latest
    # runs-on: [self-hosted, flask]
    runs-on: [self-hosted, azurevm]
    needs: code_build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # This is required to push changes back to the repository

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          # Push both latest and commit SHA tagged images to Docker Hub.
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-api:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ github.sha }} .
          docker image ls
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-api:${{ github.sha }}

      - name: Update values.yaml with new image tag
        run: |
          # Update the image tag in k8s/deployment1.yaml to use the latest commit SHA
          cat k8s/deployment1.yaml
          sed -i "s|dsahoo165/flask-api:.*|dsahoo165/flask-api:${GITHUB_SHA}|g" k8s/deployment1.yaml

          # update the helm values.yaml file with the new image tag
          sed -i "s|tag:.*|tag: ${GITHUB_SHA}|g" helm/flask-api/values.yaml

      
      - name: Show deployment yaml and helm values.yaml
        run: |
          cat k8s/deployment1.yaml
          cat helm/flask-api/values.yaml

      # - name: Debug git status
      #   run: |
      #     git status
      #     git diff
      #     git diff --cached
      #     cat k8s/deployment1.yaml                    

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add k8s/deployment1.yaml
          git add helm/flask-api/values.yaml

          # Commit the changes with a message that includes [skip ci] to prevent triggering another workflow run
          git commit -m "Update image tag [skip ci]"

          git push

      - name: Pull latest image
        run: docker pull dsahoo165/flask-api:${GITHUB_SHA}

      - name: Recreate container
        run: |
          sudo docker rm -f flask-api || true
          sudo docker run -d --name flask-api -p 80:5000 dsahoo165/flask-api:${GITHUB_SHA}          

